<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遠端螢幕 · Carrot</title><link rel="stylesheet" href="/device-tools.css"></head><body><main><nav><a href="/" id="back">‹ Carrot 工具</a><strong>carrotpilot</strong></nav><header><h1>遠端螢幕</h1></header><section id="pair"><h2>連線到車機</h2><p>停車熄火後，在車機首頁點「遠端螢幕」，輸入螢幕上的六位數配對碼。出發後乘客仍可點按及滑動車機當下開放的選單。重要警示期間暫停遠端輸入。觸碰實體螢幕可中斷分享。</p><form class="actions"><input inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="配對碼" autocomplete="off" placeholder="000000"><button class="primary">連線</button></form></section><p id="status" class="hint" role="status">尚未連線</p><canvas id="display" class="screen" role="img" aria-label="車機即時畫面" hidden></canvas><button id="disconnect" hidden>結束連線</button></main><script type="module" src="/remote-screen.js?v=2"></script></body></html>
