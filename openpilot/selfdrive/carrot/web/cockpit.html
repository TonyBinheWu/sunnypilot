<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carrot Cockpit 繁中</title><link rel="stylesheet" href="/css/cockpit.css"><link id="embeddedStyle" rel="stylesheet" media="not all" href="/css/cockpit-embedded.css"><script src="/js/realtime/vision_compact.js" defer></script><script src="/js/generated/cockpit.js" defer></script></head>
<body><header class="top"><strong>CARROT <em>COCKPIT</em></strong><span id="connection" role="status">正在連線</span><span id="clock"></span><button id="theme" aria-label="切換日夜顯示">◐</button><a href="carrotassist://app/menu">裝置</a></header>
<main><section class="visual" aria-label="車況與道路視覺"><div class="readouts"><div><div id="speed" class="speed">—</div><small>km/h</small></div><div class="limits"><div class="limit"><small>道路速限</small><b id="limit">—</b></div><div><small>巡航設定</small><b id="setSpeed">—</b></div></div></div><div class="drive-status"><strong id="gear">—</strong><span id="assist">等待車況</span><button id="profile">駕駛模式 ▾</button></div><canvas id="scene" aria-label="模型與雷達道路視覺"></canvas><div id="alert" role="alert" hidden></div><div class="scene-note"><span id="sceneStatus">等待模型資料</span><button id="expand" aria-label="放大或還原道路視覺">⛶</button></div><div class="vehicle-strip"><span id="lead">前車 —</span><span id="temperatures">車機 —</span><span id="storage">空間 —</span></div></section>
<section class="workspace" aria-label="導航與功能面板"><div id="workspaceTitle"><strong id="panelTitle">導航地圖</strong><button id="searchNav">搜尋目的地／最愛</button></div><div id="frames"><iframe id="navigation" src="/navigation?cockpit=1" title="導航與最愛地址" referrerpolicy="same-origin"></iframe><iframe id="features" src="/?cockpit_embed=1" title="Carrot 設定與工具" referrerpolicy="same-origin" hidden></iframe></div><div id="panelStatus" role="status" hidden></div></section></main>
<nav class="dock" aria-label="主要功能"><button data-panel="navigation" class="selected"><span>⌖</span>導航</button><button data-panel="vision"><span>◉</span>Carrot Vision</button><button id="sceneMode"><span>▱</span>道路視覺</button><button data-panel="logs"><span>▣</span>行車紀錄</button><button data-panel="setting"><span>⚙</span>控制與設定</button><button data-panel="tools"><span>▦</span>工具／診斷</button><a href="carrotassist://app/voice"><span>♩</span>語音</a><button id="fullscreen"><span>⛶</span>全螢幕</button></nav>
<dialog id="profiles"><form method="dialog"><button class="close" aria-label="關閉駕駛模式">×</button></form><h2>駕駛模式</h2><p>沿用 Carrot 現有模式；不會切換實驗模式或啟用控制。</p><div class="profiles"><button data-mode="1"><span>♧</span>節能</button><button data-mode="2"><span>◇</span>安全</button><button data-mode="3"><span>◎</span>一般</button><button data-mode="4"><span>↗</span>高速</button></div><section id="modeConfirm" hidden><p id="modeQuestion"></p><button id="modeApply">確認變更</button><button id="modeCancel">取消變更</button></section><p id="profileStatus" role="status"></p></dialog></body></html>
