<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carrot Cockpit 繁中</title><link rel="stylesheet" href="/css/cockpit.css"><link id="embeddedStyle" rel="stylesheet" media="not all" href="/css/cockpit-embedded.css"><script src="/js/realtime/vision_compact.js" defer></script><script src="/js/generated/cockpit.js" defer></script></head>
<body><header class="top"><strong>CARROT <em>COCKPIT</em></strong><span id="connection" role="status">正在連線</span><span id="clock"></span><button id="theme" aria-label="切換日夜顯示">◐</button><a href="carrotassist://app/menu">裝置</a></header>
<main><section class="visual" aria-label="車況與道路視覺"><div class="readouts"><div><div id="speed" class="speed">—</div><small>km/h</small></div><div class="limits"><div class="limit"><small>道路速限</small><b id="limit">—</b></div><div><small>巡航設定</small><b id="setSpeed">—</b></div></div></div><div class="drive-status"><strong id="gear">—</strong><span id="assist">等待車況</span><button id="profile">駕駛模式 ▾</button></div><canvas id="scene" aria-label="模型與雷達道路視覺"></canvas><div class="scene-note"><span id="sceneStatus">等待模型資料</span><button id="expand" aria-label="放大或還原道路視覺">⛶</button></div><div class="vehicle-strip"><span id="lead">前車 —</span><span id="temperatures">車機 —</span><span id="storage">空間 —</span></div></section>
<section class="workspace" aria-label="導航與功能面板"><div id="workspaceTitle"><strong id="panelTitle">導航地圖</strong><button id="searchNav">搜尋目的地／最愛</button><button id="visionTools" hidden>影像工具</button></div><div id="frames"><iframe id="navigation" src="/navigation?cockpit=1" title="導航與最愛地址" referrerpolicy="same-origin"></iframe><iframe id="features" src="/?cockpit_embed=1" title="Carrot 設定與工具" referrerpolicy="same-origin" hidden></iframe></div><div id="panelStatus" role="status" hidden></div></section></main>
<div id="alert" role="alert" hidden></div><nav class="dock" aria-label="主要功能"><button data-panel="setting" aria-label="控制與設定" title="控制與設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 2-5h10l2 5m-15 1h16v9H4Zm0 4h16m-14 5v2m12-2v2M7 12h1m8 0h1"/></svg><span class="dock-label">控制與設定</span></button><button data-panel="navigation" class="selected" aria-label="導航" title="導航"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 18-8-4-8 4Z"/></svg><span class="dock-label">導航</span></button><button data-panel="vision" aria-label="Carrot Vision" title="Carrot Vision"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="4"/></svg><span class="dock-label">Carrot Vision</span></button><button id="sceneMode" aria-label="道路視覺" title="道路視覺"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 21 4-18m8 18-4-18m-2 3v3m0 3v3m0 3v3"/></svg><span class="dock-label">道路視覺</span></button><button id="appsButton" aria-label="應用程式" title="應用程式"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="dock-label">應用程式</span></button><a href="carrotassist://app/voice" aria-label="語音" title="語音"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2m-6 8v3m-3 0h6"/></svg><span class="dock-label">語音</span></a><button id="fullscreen" aria-label="全螢幕" title="全螢幕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/></svg><span class="dock-label">全螢幕</span></button></nav>
<dialog id="apps" class="apps-sheet"><form method="dialog"><button class="close" aria-label="關閉應用程式">×</button></form><h2>應用程式</h2><div class="app-grid"><button data-panel="logs" aria-label="行車紀錄" title="行車紀錄"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 8 6 4-6 4Z"/></svg><span class="dock-label">行車紀錄</span></button><button data-panel="tools" aria-label="工具／診斷" title="工具／診斷"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="dock-label">工具／診斷</span></button><button data-panel="navigation">導航與最愛</button><button data-panel="vision">即時影像</button><button data-panel="setting">全部設定</button><a href="carrotassist://app/menu">裝置與 App 更新</a></div></dialog><dialog id="profiles"><form method="dialog"><button class="close" aria-label="關閉駕駛模式">×</button></form><h2>駕駛模式</h2><p>沿用 Carrot 現有模式；不會切換實驗模式或啟用控制。</p><div class="profiles"><button data-mode="1"><span>♧</span>節能</button><button data-mode="2"><span>◇</span>安全</button><button data-mode="3"><span>◎</span>一般</button><button data-mode="4"><span>↗</span>高速</button></div><section id="modeConfirm" hidden><p id="modeQuestion"></p><button id="modeApply">確認變更</button><button id="modeCancel">取消變更</button></section><p id="profileStatus" role="status"></p></dialog></body></html>
