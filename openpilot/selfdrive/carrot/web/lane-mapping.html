<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>車道建圖與多趟比對</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1420;color:#e5eff8}body{margin:0;font-size:calc(16px * var(--carrot-text-scale,1))}button,select,textarea,input{font:inherit}button,a,select{min-height:42px}button,select{background:#22364a;color:inherit;border:1px solid #52677e;border-radius:9px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.5}a{color:#8fddfa}h1{font-size:1.35em;margin:0}h2{font-size:1.1em}p{line-height:1.6}header{display:flex;gap:15px;align-items:center;padding:14px 20px;border-bottom:1px solid #334456;flex-wrap:wrap}header small{color:#fac989}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100dvh - 80px)}main{position:relative;min-width:0}#scene{display:block;width:100%;height:calc(100dvh - 150px);min-height:340px;touch-action:none}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px}.toolbar input{width:100px}.sidebar{padding:8px 20px 30px;background:#152234;max-height:calc(100dvh - 80px);overflow:auto}.sidebar p,small{font-size:.88em}.sidebar label{display:block;margin:8px 0}#tripList label{overflow-wrap:anywhere}textarea{width:100%;resize:vertical;background:#091421;border:1px solid #52677e;border-radius:7px;padding:8px;color:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85em}#error{color:#ffb1ac}#sourceNote{color:#fac989}details{border-top:1px solid #3a4e63;margin-top:16px;padding-top:12px}summary{cursor:pointer;font-weight:bold}#projectInfo{overflow-wrap:anywhere}.legend{margin:0;padding:8px 15px;font-size:.8em;color:#b7cadc}#selection{border:1px solid #51718e;border-radius:9px;padding:10px}#selection button{margin:4px 0}#file{max-width:100%;font-size:.8em}:focus-visible{outline:3px solid #8fd9fb;outline-offset:2px}[hidden]{display:none!important}@media(max-width:800px){.layout{display:flex;flex-direction:column}.sidebar{max-height:none}#scene{height:52dvh;min-height:300px}header{padding:10px}h1{font-size:1.1em}}
</style></head><body>
<header><a href="/?page=tools" data-text="back">返回工具</a><h1 data-text="title">車道建圖與多趟比對</h1><small data-text="research"></small></header>
<div class="layout"><main>
<div class="toolbar"><button id="top" data-text="top"></button><button id="three" data-text="three"></button><label><span data-text="yaw"></span> <input id="yaw" type="range" min="0" max="360" value="0"></label><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="reset" data-text="reset"></button></div>
<canvas id="scene" role="img"></canvas><p class="legend"><span data-text="legend"></span><br><span data-text="gridNote"></span></p>
</main><aside class="sidebar">
<p id="sourceNote" role="status"></p><p data-text="intro"></p>
<h2 data-text="catalog"></h2><select id="catalog" aria-label="Offline project"></select> <button id="open" data-text="load" disabled></button> <button id="demo" data-text="demo"></button>
<p id="projectInfo"></p><p><span data-text="points"></span>: <strong id="count">0</strong></p>
<div id="replaceConfirm" role="group" hidden><p data-text="reviewHelp"></p><button id="replace" data-text="replace"></button><button id="keep" data-text="keep"></button></div>
<h2 data-text="trips"></h2><div id="tripList"></div><label><span data-text="support"></span> <select id="support"><option value="1" data-text="all"></option><option value="2" data-text="multi"></option></select></label>
<p data-text="select"></p><section id="selection" hidden><pre id="cellInfo"></pre><label><span data-text="note"></span><input id="note" maxlength="160" style="width:100%"></label><button id="accept" data-text="accept"></button><button id="reject" data-text="reject"></button><button id="inspect" data-text="inspect"></button><p id="reviewState" role="status"></p></section>
<p><button id="reviews" data-text="reviews"></button></p><p data-text="reviewHelp"></p><textarea id="reviewJson" rows="6" readonly hidden aria-label="Review JSON"></textarea>
<details open><summary data-text="sources"></summary><p data-text="quality"></p><p id="changeCounts"></p><p data-text="changeHelp"></p></details>
<details><summary data-text="local"></summary><input id="file" type="file" accept="application/json,.json"><label for="paste" data-text="paste"></label><textarea id="paste" rows="5" maxlength="8388608"></textarea><button id="import" data-text="import"></button></details><p id="error" role="alert"></p>
<details><summary data-text="guide"></summary><p data-text="guideText"></p><p data-text="hardware"></p><p data-text="limits"></p><p data-text="privacy"></p></details>
</aside></div><script defer src="/js/generated/display-preferences.js"></script><script defer src="/js/generated/lane-mapping.js"></script></body></html>
