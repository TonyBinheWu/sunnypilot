<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1424"><meta name="description" content="FormosaLink — FormosaPilot device companion">
  <title>FormosaLink · FormosaPilot</title>
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/formosapilot-logo.png">
  <link rel="apple-touch-icon" href="/assets/formosapilot-logo.png"><link rel="stylesheet" href="/style.css?v=0.3.0">
  <script type="module" src="/app.js?v=0.3.0"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="FormosaLink"><img src="/assets/formosapilot-logo.png" alt=""><span>FormosaLink</span></a>
    <nav id="public-nav" class="public-nav" aria-label="FormosaLink"><a href="#features" data-i18n="navFeatures"></a><a href="#how-it-works" data-i18n="navHow"></a></nav>
    <div class="header-actions"><details class="language-menu" id="language-menu"><summary id="language" aria-label="Language">繁體中文</summary><div class="language-options"><button type="button" data-language="zh-TW">繁體中文</button><button type="button" data-language="en">English</button><button type="button" data-language="ja">日本語</button></div></details><a id="nav-signin" class="nav-signin" href="#login-view" data-i18n="signinShort"></a><button id="logout" class="quiet" hidden data-i18n="logout"></button></div>
  </header>
  <main>
    <div id="login-view">
      <section class="hero">
        <div class="hero-copy">
          <span class="release-badge"><span class="tiny-dot"></span><span data-i18n="releaseBadge"></span></span>
          <h1><span data-i18n="heroTitle"></span><span class="gradient-text" data-i18n="heroAccent"></span></h1>
          <p class="hero-description" data-i18n="heroDescription"></p>
          <div class="hero-actions"><button id="github-login" class="primary" type="button" disabled><span data-i18n="githubLogin"></span><span aria-hidden="true">↗</span></button><a class="secondary" href="#how-it-works"><span data-i18n="getStarted"></span><span aria-hidden="true">→</span></a></div>
          <p id="github-note" class="caption" data-i18n="githubUnavailable"></p>

          <div class="formosa-signature"><span class="island-mark" aria-hidden="true"></span><span>FORMOSA · 23.5° N</span><span class="signature-line"></span><span data-i18n="taiwanMade"></span></div>
        </div>
        <figure class="product-figure">
          <div class="product-glow" aria-hidden="true"></div>
          <div class="product-window" aria-hidden="true">
            <div class="window-bar"><span class="window-dots"><i></i><i></i><i></i></span><span>formosapilot.dinglu-t.com</span><span class="window-lock">◇</span></div>
            <div class="preview-app"><aside class="preview-sidebar"><img src="/assets/formosapilot-logo.png" alt=""><span class="preview-nav active">▦</span><span class="preview-nav">◈</span><span class="preview-sidebar-bottom">23.5°</span></aside>
              <div class="preview-main"><div class="preview-heading"><span data-i18n="dashboard"></span><span class="preview-chip" data-i18n="previewLabel"></span></div><div class="preview-stats"><div><span data-i18n="devices"></span><b>1</b></div><div><span data-i18n="readonly"></span><b>◈</b></div></div><div class="preview-device"><div class="preview-device-name"><span class="device-symbol">▱</span><div><strong>FormosaPilot</strong><small data-i18n="previewLabel"></small></div><span class="preview-dot"></span></div><div class="preview-metrics"><div><small data-i18n="cpu"></small><b>46<span>°C</span></b><i></i></div><div><small data-i18n="memory"></small><b>31<span>%</span></b><i></i></div></div><div class="preview-device-footer"><span>hkg-enhanced / ccnc-port</span><span>HTTPS</span></div></div><div class="preview-lines"><i></i><i></i><i></i></div></div>
            </div>
          </div>
          <figcaption><span class="tiny-dot"></span><span data-i18n="previewCaption"></span></figcaption>
        </figure>
      </section>
      <section id="features" class="landing-section">
        <div class="section-heading"><span class="eyebrow" data-i18n="navFeatures"></span><h2 data-i18n="featuresTitle"></h2><p data-i18n="featuresIntro"></p></div>
        <div class="feature-grid"><article class="feature-card"><span class="feature-icon" aria-hidden="true">◈</span><h3 data-i18n="featurePairTitle"></h3><p data-i18n="featurePairText"></p></article><article class="feature-card"><span class="feature-icon" aria-hidden="true">⌁</span><h3 data-i18n="featureMonitorTitle"></h3><p data-i18n="featureMonitorText"></p></article><article class="feature-card"><span class="feature-icon" aria-hidden="true">◇</span><h3 data-i18n="featurePrivateTitle"></h3><p data-i18n="featurePrivateText"></p></article></div>
      </section>
      <section id="how-it-works" class="landing-section how-section">
        <div class="section-heading"><span class="eyebrow" data-i18n="navHow"></span><h2 data-i18n="stepsTitle"></h2><p data-i18n="stepsIntro"></p></div>
        <div class="steps-grid"><article><span class="step-number">01</span><h3 data-i18n="stepSignIn"></h3><p data-i18n="stepSignInText"></p></article><article><span class="step-number">02</span><h3 data-i18n="stepPair"></h3><p data-i18n="stepPairText"></p></article><article><span class="step-number">03</span><h3 data-i18n="stepMonitor"></h3><p data-i18n="stepMonitorText"></p></article></div>
      </section>
    </div>
    <section id="dashboard" hidden>
      <div class="dashboard-shell">
        <aside class="dashboard-sidebar"><div class="sidebar-title">FORMOSALINK</div><a class="sidebar-item active" href="#dashboard"><span aria-hidden="true">▦</span><span data-i18n="dashboard"></span></a><button id="sidebar-pair" class="sidebar-item" type="button"><span aria-hidden="true">＋</span><span data-i18n="pairDevice"></span></button><div class="sidebar-bottom"><span class="tiny-dot"></span><span data-i18n="privateSpace"></span><small>FORMOSA · 23.5° N</small></div></aside>
        <div class="dashboard-main">
          <div class="page-heading"><div><span class="eyebrow" data-i18n="companion"></span><h1 data-i18n="dashboard"></h1><p class="lead" data-i18n="dashboardIntro"></p></div><button id="open-pair" class="primary"><span aria-hidden="true">＋</span><span data-i18n="pairDevice"></span></button></div>
          <div class="account"><span class="account-avatar" aria-hidden="true">◈</span><span id="account-name"></span><button id="github-link" class="quiet" hidden data-i18n="githubLink"></button><span class="account-security" data-i18n="accountPrivate"></span></div>
          <div class="overview"><div class="stat-card"><span class="stat-label" data-i18n="devices"></span><strong id="device-count">—</strong><span class="stat-icon" aria-hidden="true">▦</span></div><div class="stat-card"><span class="stat-label" data-i18n="online"></span><strong id="online-count">—</strong><span class="stat-icon online-icon" aria-hidden="true">⌁</span></div><div class="refresh-info"><span class="tiny-dot"></span><span id="refresh-label" data-i18n="waiting"></span><button id="refresh" class="quiet" data-i18n="refresh"></button></div></div>
          <div id="empty" class="panel empty" hidden><img src="/assets/formosapilot-logo.png" alt=""><h2 data-i18n="noDevices"></h2><p data-i18n="emptyHelp"></p><button class="primary" id="empty-pair" data-i18n="pairDevice"></button></div>
          <div id="device-grid" class="device-grid"></div>
          <aside class="scope-note"><span class="scope-icon" aria-hidden="true">◇</span><div><strong data-i18n="readonly"></strong><p data-i18n="scope"></p></div></aside>
        </div>
      </div>
    </section>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
  </main>
  <dialog id="pair-dialog"><form id="pair-form"><div class="dialog-heading"><span class="eyebrow" data-i18n="securePairing"></span><button id="close-pair" type="button" class="quiet" data-i18n="close"></button></div><h2 data-i18n="pairDevice"></h2><p class="caption" data-i18n="pairHelp"></p><div id="pair-scan-help" class="qr-help"><span class="qr-symbol" aria-hidden="true">▦</span><p data-i18n="qrScanHelp"></p></div><div id="pair-details" hidden><div class="qr-confirm-note"><span class="tiny-dot"></span><span data-i18n="qrReady"></span></div><label for="device-name" data-i18n="deviceName"></label><input id="device-name" required maxlength="60" value="FormosaPilot"><p class="caption" data-i18n="qrConfirmHelp"></p></div><button id="confirm-pair" type="submit" class="primary" hidden data-i18n="confirmPair"></button></form></dialog>
  <dialog id="settings-dialog" class="settings-dialog"><div class="dialog-heading"><h2 id="settings-title"></h2><button type="button" id="close-settings" class="quiet" data-i18n="close"></button></div><div id="settings-body"></div></dialog>
  <footer><a class="footer-brand" href="/">FormosaLink<span>FORMOSAPILOT</span></a><span data-i18n="footer"></span><span class="footer-origin">TAIWAN · 23.5° N</span></footer>
</body>
</html>
