name: Startup recovery checks
on:
  push:
    branches: [carrot-wip, carrot-nav]
    # Check every branch push: bootstrap can break through transitive imports,
    # font/translation changes or dependency updates outside launcher/UI paths.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 aiohttp requests numpy raylib==5.5.0.4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Recovery and real process-lock regression checks
        env:
          PYTHONPATH: .:opendbc_repo
        run: |
          bash -n launch_chffrplus.sh scripts/ensure_params_build.sh
          python -m pytest --noconftest -o addopts= -q \
            openpilot/common/tests/test_forced_offroad.py \
            openpilot/common/tests/test_carrot_vision_camera.py \
            openpilot/system/manager/test/test_python_process_spawn.py \
            openpilot/system/manager/test/test_process_crash.py \
            openpilot/system/tests/test_build_cache.py \
            openpilot/system/tests/test_rebuild_cleanup.py \
            openpilot/system/tests/test_startup_recovery.py \
            openpilot/system/tests/test_startup_touch_log.py \
            openpilot/system/tests/test_reboot_sound.py \
            openpilot/system/tests/test_bootstrap_ui.py \
            openpilot/selfdrive/carrot/server/tests/test_git_config.py

  fresh_install:
    name: Fresh AGNOS UI / ${{ matrix.raylib }}
    strategy:
      fail-fast: false
      matrix:
        raylib: ['raylib==5.5.0.4', 'comma-deps-raylib==6.0.0.1.post103']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Deliberately omit pyserial and all SCons-generated modules. This is the
      # dependency boundary before the first OS update on a clean vehicle.
      - run: python -m pip install pytest==8.3.5 requests numpy "${{ matrix.raylib }}" pycapnp setproctitle pyzmq jeepney cffi zstandard pillow
      - name: Import real C4 and C3 updater, spinner and failure-display graphs
        env:
          PYTHONPATH: .:opendbc_repo
          SCALE: '1'
        run: >-
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/system/tests -q
          openpilot/system/tests/test_fresh_install_bootstrap.py
          openpilot/system/tests/test_bootstrap_font_atlas.py
