name: FormosaLink shared platform
on:
  push:
    branches: [carrot-wip]
    paths: ['formosalink/**', 'openpilot/sunnypilot/formosalink/**', 'openpilot/common/params_keys.h', 'openpilot/selfdrive/ui/ui.py', 'openpilot/selfdrive/ui/sunnypilot/layouts/settings/device.py', 'openpilot/selfdrive/ui/sunnypilot/mici/layouts/settings.py', 'openpilot/system/manager/process_config.py', 'tools/deploy/publish_formosalink_iis.ps1', '.github/workflows/formosalink.yml']
  pull_request:
    paths: ['formosalink/**', 'openpilot/sunnypilot/formosalink/**', 'openpilot/common/params_keys.h', 'openpilot/selfdrive/ui/ui.py', 'openpilot/selfdrive/ui/sunnypilot/layouts/settings/device.py', 'openpilot/selfdrive/ui/sunnypilot/mici/layouts/settings.py', 'openpilot/system/manager/process_config.py', 'tools/deploy/publish_formosalink_iis.ps1', '.github/workflows/formosalink.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r formosalink/requirements-test.txt 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python -m formosalink.tests.browser_live_check
      - run: python -m formosalink.tests.browser_carrot_settings_check
  host-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r formosalink/requirements-test.txt requests websocket-client
      - run: python -m pytest formosalink/tests --confcutdir=formosalink -o addopts='' -q
      - run: node --test 'formosalink/tests/*.test.mjs'
      - if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File formosalink/tests/check_setup.ps1 -ScriptPath "${{ github.workspace }}/formosalink/deploy/setup-server.ps1"
      - if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File formosalink/tests/check_oauth_input.ps1 -Python (Get-Command python).Source
