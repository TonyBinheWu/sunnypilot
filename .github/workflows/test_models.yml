name: Validate CTM v3 Plain Tinygrad Loader
on:
  pull_request:
    paths:
      - 'tinygrad_repo'
      - 'openpilot/sunnypilot/modeld_v2/**'
      - 'openpilot/sunnypilot/models/fetcher.py'
      - '.github/workflows/test_models.yml'
  workflow_dispatch:

jobs:
  ctmv3-model-load:
    runs-on: ubuntu-latest
    container: ghcr.io/commaai/openpilot-base:latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Validate v28 manifest and tinygrad revision
        id: manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import ast
          import subprocess
          import urllib.request
          from pathlib import Path

          fetcher = Path("openpilot/sunnypilot/models/fetcher.py").read_text()
          catalog_line = next((line for line in fetcher.splitlines() if line.strip().startswith('MODEL_URL_CHESTNUT =')), None)
          assert catalog_line, 'Missing Chestnut catalog URL'
          catalog_url = ast.literal_eval(catalog_line.split('=', 1)[1].strip())
          with urllib.request.urlopen(catalog_url, timeout=30) as response:
            data = json.load(response)
          bundle = next((b for b in data["bundles"] if b.get("short_name") == "CTV3M"), None)
          assert bundle is not None, "CTM v3 is missing from catalog"
          assert int(bundle["minimum_selector_version"]) == 21, "Unexpected catalog version"
          artifact = bundle["models"][0]["artifact"]
          assert artifact["download_uri"]["url"] and artifact["download_uri"]["sha256"]
          assert not artifact.get("chunks"), "Expected v28 whole-file model artifact"
          ref = subprocess.check_output(["git", "-C", "tinygrad_repo", "rev-parse", "HEAD"], text=True).strip()
          assert ref == data["tinygrad_ref"], f"tinygrad mismatch: {ref} != {data['tinygrad_ref']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write(f"filename={artifact['file_name']}\n")
            out.write(f"url={artifact['download_uri']['url']}\n")
            out.write(f"sha256={artifact['download_uri']['sha256']}\n")
          PY

      - name: Download CTM v3 and verify SHA-256
        env:
          MODEL_URL: ${{ steps.manifest.outputs.url }}
          MODEL_SHA256: ${{ steps.manifest.outputs.sha256 }}
          FILE_NAME: ${{ steps.manifest.outputs.filename }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/models
          if [ -n "${HF_TOKEN:-}" ]; then
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              -o "/tmp/models/${FILE_NAME}" "${MODEL_URL}"
          else
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
              -o "/tmp/models/${FILE_NAME}" "${MODEL_URL}"
          fi
          printf '%s  %s\n' "${MODEL_SHA256}" "/tmp/models/${FILE_NAME}" | sha256sum --check

      - name: Validate CTM v3 plain artifact can load on CPU
        env:
          MODEL_BASE_NAME: ${{ steps.manifest.outputs.filename }}
          MODEL_DIR: /tmp/models
        shell: bash
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/tinygrad_repo:${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
          python3 -m pytest -q openpilot/sunnypilot/modeld_v2/tests/test_models.py
