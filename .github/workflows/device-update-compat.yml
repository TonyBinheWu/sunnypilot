name: C3X and C4 update compatibility
on:
  push:
    branches: [hkg-enhanced, ccnc-port]
  pull_request:
    branches: [hkg-enhanced, ccnc-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-update-ui:
    name: Update UI (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: mici
            big: '0'
          - device: tizi
            big: '1'
    env:
      CI: '1'
      PYTHONPATH: ${{ github.workspace }}
      BIG: ${{ matrix.big }}
      EXPECTED_DEVICE: ${{ matrix.device }}
      SUNNYPILOT_UI: '1'
      RAYLIB_BACKEND: headless
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: lfs.fetchexclude
      GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_tinygrad.pkl
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned dependencies
        run: ./tools/op.sh setup
      - name: Install graphics dependencies
        run: sudo apt-get install -y --no-install-recommends libgles2 libegl1
      - name: Build host dependencies
        run: .venv/bin/scons -j4
      - name: Check real updater output and render the device UI
        run: .venv/bin/python tools/diagnostics/check_device_update_compat.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-notes-${{ matrix.device }}
          path: update-notes-${{ matrix.device }}*.png
