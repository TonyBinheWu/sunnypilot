name: Carrot C4 installer
on:
  workflow_dispatch:
  push:
    branches: [carrot-wip]
    # Check every push, including service/backend compatibility changes outside
    # our checkout. A valid wrapper ELF alone cannot prove a working C4 UI.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -c /dev/null --rootdir=. --noconftest -q tools/carrot_installer/test_installer.py tools/carrot_installer/test_official.py
      - name: Inspect actual official C4 loader, display backend and fork target
        run: python tools/carrot_installer/verify_official.py --output /tmp/carrot-official-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: carrot-c4-official-verification
          path: /tmp/carrot-official-report.json
