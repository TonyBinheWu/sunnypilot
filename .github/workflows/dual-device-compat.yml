name: C4 and C3X compatibility
on:
  pull_request:
    paths:
      - 'launch*.sh'
      - 'openpilot/common/hardware/**'
      - 'openpilot/common/realtime.py'
      - 'openpilot/common/tests/test_ratekeeper_stall.py'
      - 'openpilot/system/hardware/**'
      - 'openpilot/selfdrive/ui/**'
      - 'openpilot/system/ui/**'
      - 'openpilot/system/manager/**'
      - 'tools/diagnostics/test_boot_diagnostics.py'
      - 'tools/diagnostics/test_font_atlas_lifecycle.py'
      - 'tools/diagnostics/check_dual_device_compat.py'
      - 'tools/diagnostics/check_calibrated_onroad.py'
      - '.github/workflows/dual-device-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-ui-profile:
    name: Host UI profile (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: mici
            big: '0'
          - device: tizi
            big: '1'
    env:
      CI: '1'
      PYTHONPATH: ${{ github.workspace }}
      BIG: ${{ matrix.big }}
      EXPECTED_DEVICE: ${{ matrix.device }}
      SUNNYPILOT_UI: '1'
      RAYLIB_BACKEND: headless
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: lfs.fetchexclude
      GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_tinygrad.pkl
    steps:
      - uses: actions/checkout@v4
      - name: Fault injection without built dependencies
        run: python3 tools/diagnostics/test_boot_diagnostics.py
      - name: Verify stable CJK font atlas and unsupported glyph behavior
        run: python3 tools/diagnostics/test_font_atlas_lifecycle.py
      - name: Set up repository and pinned dependencies
        run: ./tools/op.sh setup
      - name: Install headless graphics dependencies
        run: sudo apt-get install -y --no-install-recommends libgles2 libegl1
      - name: Render independent diagnostic screen
        run: |
          .venv/bin/python - <<'PYCODE'
          import json
          from pathlib import Path
          data = {"device": "pc", "commit": "test12345678", "id": "diagnostic-test",
                  "stage": "ui", "exit": "exit 1", "location": "openpilot/selfdrive/ui/layouts/main.py:123",
                  "summary": "RuntimeError: INJECTED TEST - not a real device failure",
                  "detail": "Traceback (most recent call last):\n  File main.py, line 123\nRuntimeError: injected test"}
          Path("diagnostic-test.json").write_text(json.dumps(data))
          PYCODE
          .venv/bin/python openpilot/system/ui/crash_screen.py diagnostic-test.json --device "${{ matrix.device }}" --frames 3 --screenshot "diagnostic-${{ matrix.device }}.png"
          test -s "diagnostic-${{ matrix.device }}.png"
      - name: Build host dependencies
        run: .venv/bin/scons -j4
      - name: Verify normal timing and recovery after stalls
        run: .venv/bin/python -m unittest openpilot.common.tests.test_ratekeeper_stall -v
      - name: Verify bootstrap, platform identity, custom UI and rendered frames
        run: .venv/bin/python tools/diagnostics/check_dual_device_compat.py
      - name: Exercise calibration transition and real onroad overlays
        run: .venv/bin/python tools/diagnostics/check_calibrated_onroad.py
      - name: Upload diagnostic rendering
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screen-${{ matrix.device }}
          path: diagnostic-${{ matrix.device }}.png
